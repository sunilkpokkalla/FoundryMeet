name: FoundryMeet
options:
  bundleIdPrefix: com.startupnetwork
settings:
  base:
    # Xcode 26 Explicit Modules fails on FirebaseFirestoreInternal binary headers
    # ("module 'Foundation' is needed but has not been provided").
    SWIFT_ENABLE_EXPLICIT_MODULES: NO
    CLANG_ENABLE_EXPLICIT_MODULES: NO
targets:
  FoundryMeet:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources: [FoundryMeet]
    dependencies:
      - package: Firebase
        product: FirebaseAnalytics
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseCore
      - package: Firebase
        product: FirebaseFirestore
    settings:
      base:
        SWIFT_ENABLE_EXPLICIT_MODULES: NO
        CLANG_ENABLE_EXPLICIT_MODULES: NO
    info:
      path: FoundryMeet/Info.plist
      properties:
        UILaunchScreen: {}
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk.git
    from: 12.16.0
